<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kigo xpress</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f3f4f6}
.app{max-width:500px;margin:auto;background:#fff;min-height:100vh;display:flex;flex-direction:column;padding-bottom:72px}
#map{width:100%;height:52vh}.map-container{position:relative;overflow:hidden}
.panel{padding:16px;border-radius:22px 22px 0 0;margin-top:-18px;position:relative;z-index:1000;background:#fff;flex:1;box-shadow:0 -4px 20px rgba(0,0,0,.12)}
.step{background:#f7f7f8;border:1px solid #eee;padding:12px;border-radius:14px;margin-bottom:12px}
.colonia-input{width:100%;padding:14px;border:1.5px solid #ddd;border-radius:12px;font-size:14px;font-weight:600;outline:none}
.suggestions{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 10px 25px rgba(0,0,0,.18);z-index:9999;display:none;max-height:300px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{padding:12px 14px;border-bottom:1px solid #f2f2f2;display:flex;gap:10px;align-items:center;cursor:pointer}
.btn-cotizar{width:100%;padding:16px;border:none;border-radius:14px;background:#E53935;color:#fff;font-weight:900;font-size:15px;margin-top:10px;cursor:pointer}
.btn-whatsapp{width:100%;padding:14px;border:1.5px solid #25D366;border-radius:14px;background:#fff;color:#25D366;font-weight:800;font-size:13px;margin-top:10px;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px}
.btn-whatsapp.show{display:flex}
.price-box{margin-top:12px;padding:16px;background:#111;color:#fff;border-radius:14px;display:flex;justify-content:space-between;font-weight:900}
.input-wrapper{position:relative}.info{display:flex;gap:10px;margin-top:12px}.info-box{flex:1;background:#f7f7f8;padding:12px;border-radius:12px;text-align:center;border:1px solid #eee}
.weather-widget{position:absolute;top:12px;right:12px;z-index:999;background:#fff;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:900;display:flex;align-items:center;gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.25);border:1px solid #eee}
.weather-widget.lluvia{background:#dbeafe;color:#1e40af}.weather-widget.tormenta{background:#1e293b;color:#fff}
.rain-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:400;pointer-events:none;display:none;background:rgba(30,58,138,0.12)}.rain-overlay.active{display:block}
.rain{position:absolute;top:-20px;width:2px;height:16px;background:linear-gradient(to bottom, transparent, #9ec3ff);animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(0)}100%{transform:translateY(60vh)}}
.weather-badge{position:absolute;bottom:12px;left:12px;z-index:999;background:#1e3a8a;color:#fff;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:900;display:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}.weather-badge.show{display:block}
.weather-badge.tormenta{background:#7f1d1d}.weather-badge.moderada{background:#1e40af}.weather-badge.leve{background:#1e3a8a}
.reset-btn{position:absolute;top:12px;left:12px;z-index:999;background:#fff;border:1px solid #ddd;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:16px;font-weight:900}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:#fff;border-top:1px solid #eee;display:flex;z-index:99999;box-shadow:0 -4px 15px rgba(0,0,0,.08);padding:8px 10px;gap:10px}
.bottom-nav button{flex:1;padding:10px;border:none;border-radius:12px;font-weight:900;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.btn-inicio{background:#111;color:#fff}.btn-admin{background:#f3f4f6;color:#111;border:1px solid #ddd!important}
.bottom-nav button.active{background:#E53935;color:#fff;border:none!important}
.bottom-nav svg{width:20px;height:20px}
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:100000;display:none;align-items:center;justify-content:center;padding:12px}
.admin-overlay.show{display:flex}
.admin-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:18px;box-shadow:0 15px 40px rgba(0,0,0,.3);animation:pop.25s ease;max-height:92vh;overflow-y:auto}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.admin-input{width:100%;padding:13px;border:1.5px solid #ddd;border-radius:12px;margin-bottom:10px;font-weight:600;outline:none}
.close-admin{position:absolute;top:12px;right:12px;background:#fff;border:none;width:34px;height:34px;border-radius:50%;font-weight:900;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;padding:10px;border-radius:10px;border:1px solid #ddd;background:#f7f7f8;font-weight:800;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}
.tab.active{background:#111;color:#fff;border-color:#111}
.cliente-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #eee;border-radius:12px;margin-bottom:8px;background:#fafafa}
.cliente-actions{display:flex;gap:6px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid #ddd;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn.delete{background:#fff0f0;border-color:#f5c2c2}
</style>
</head>
<body>
<div class="app">
<div class="map-container">
<div id="map"></div>
<div class="map-message" style="background:white; width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center; padding:2px; box-shadow:0 2px 10px rgba(0,0,0,.25); position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:999;">
  <img src="https://firebasestorage.googleapis.com/v0/b/glide-prod.appspot.com/o/icon-images%2Fanonymous-ba983199-acce-404e-b058-c75e9633b325.jpeg?alt=media&token=a58284c1-111c-4874-b60f-35380cf5fbe3" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">
</div>
<div class="reset-btn" id="resetBtn">↻</div>
<div id="weatherWidget" class="weather-widget">☀️ --°C</div>
<div id="rainOverlay" class="rain-overlay"></div>
<div id="weatherBadge" class="weather-badge">🌧️ LLOVIENDO EN DOLORES</div>
</div>
<div class="panel">
<div class="step"><div style="font-size:11px;font-weight:800;color:#666;margin-bottom:6px">1. ¿DÓNDE RECOGER?</div><div class="input-wrapper"><input id="pickupInput" class="colonia-input" placeholder="Escribe Centro o colonia..." autocomplete="off"><div id="pickupSuggestions" class="suggestions"></div></div></div>
<div class="step"><div style="font-size:11px;font-weight:800;color:#666;margin-bottom:6px">2. ¿DÓNDE ENTREGAR?</div><div class="input-wrapper"><input id="destinationInput" class="colonia-input" placeholder="Escribe colonia..." autocomplete="off"><div id="destinationSuggestions" class="suggestions"></div></div></div>
<button id="calculateButton" class="btn-cotizar">COTIZAR SERVICIO</button>
<button id="whatsappButton" class="btn-whatsapp">📲 Compartir cotización por WhatsApp</button>
<div class="info"><div class="info-box"><div style="font-size:9px;color:#888;font-weight:700">DISTANCIA MOTO</div><div id="distance" style="font-weight:800">—</div></div><div class="info-box"><div style="font-size:9px;color:#888;font-weight:700">TIEMPO</div><div id="duration" style="font-weight:800">—</div></div></div>
<div class="price-box"><span>PRECIO</span><span id="price">POR COTIZAR</span></div>
</div>
</div>
<div class="bottom-nav">
  <button id="btnInicio" class="btn-inicio active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>INICIO</button>
  <button id="btnAdmin" class="btn-admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0.33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 9 15a1.65 1.65 0 0 0-1-1.51V13a2 2 0 0 1 0-4v-.49c0-.6.38-1.13 1-1.51A1.65 1.65 0 0 0 10.83 6.67l-.06-.06A2 2 0 1 1 13.6 3.78l.06.06A1.65 1.65 0 0 0 15.48 4.17c.6.38 1.13 1 1.51 1v.49a2 2 0 0 1 0 4v.49c0.6-.38 1.13-1 1.51Z"/></svg>ADMIN</button>
</div>
<div id="adminOverlay" class="admin-overlay">
  <button class="close-admin" id="closeAdmin">✕</button>
  <div id="loginBox" class="admin-card">
    <h3 style="margin:0 0 6px 0;display:flex;align-items:center;gap:8px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Admin Kigo Xpress</h3>
    <p style="font-size:12px;color:#777;margin-top:0">Acceso privado</p>
    <input id="adminUser" class="admin-input" placeholder="Usuario">
    <input id="adminPass" class="admin-input" type="password" placeholder="Contraseña">
    <button id="loginBtn" class="btn-cotizar">ENTRAR</button>
    <div id="loginError" style="color:#E53935;font-size:12px;font-weight:700;margin-top:10px;display:none">Usuario o contraseña incorrectos</div>
  </div>
  <div id="adminPanel" class="admin-card" style="display:none; max-width:400px;">
    <div class="tabs">
      <button class="tab active" id="tabClientes"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>CLIENTES</button>
    </div>
    <div id="clientesSection">
      <h4 style="margin:0 0 10px 0">Agregar Cliente</h4>
      <input id="clienteNombre" class="admin-input" placeholder="Nombre del cliente">
      <div style="position:relative">
        <input id="clienteUbicacion" class="admin-input" placeholder="Ubicación / Colonia" style="padding-right:38px">
        <button id="btnVincularUbicacion" style="position:absolute; right:6px; top:6px; width:32px; height:32px; border-radius:8px; border:1px solid #ddd; background:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </button>
      </div>
      <button id="guardarCliente" class="btn-cotizar" style="margin-top:0; padding:12px;">GUARDAR CLIENTE</button>
      <div style="margin-top:14px; border-top:1px solid #eee; padding-top:10px;">
        <div style="font-size:11px; font-weight:800; color:#666; margin-bottom:8px;">LISTA DE CLIENTES (<span id="contadorClientes">0</span>)</div>
        <div id="listaClientes" style="max-height:300px; overflow-y:auto;"></div>
      </div>
      <button id="logoutBtn" style="margin-top:14px;width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;background:#fff;font-weight:800;cursor:pointer">Cerrar sesión</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTRO={lat:21.1561,lng:-100.9333};
let pickupLat=null,pickupLng=null,destinationLat=null,destinationLng=null,pickupMarker=null,destinationMarker=null,routeLayer=null,ultimaDistancia="",ultimoPrecio="",pickupName="",destName="";
let extraLluvia=0;
const map=L.map("map",{zoomControl:false}).setView([CENTRO.lat,CENTRO.lng],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);
const pickupInput=document.getElementById("pickupInput"),destinationInput=document.getElementById("destinationInput"),pickupSuggestions=document.getElementById("pickupSuggestions"),destinationSuggestions=document.getElementById("destinationSuggestions");
const rainOverlay=document.getElementById("rainOverlay"),weatherBadge=document.getElementById("weatherBadge"),weatherWidget=document.getElementById("weatherWidget");
function distMts(lat1,lon1,lat2,lon2){const R=6371000;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
async function buscarColonias(t){const texto=t.toLowerCase();let resultados=[];if(texto.includes("centro")||texto.includes("cent")){resultados.push({lat:CENTRO.lat,lon:CENTRO.lng,name:"Centro - Zona Centro",direccion:"Centro, Dolores Hidalgo, Gto."});}const q=encodeURIComponent(t+", Dolores Hidalgo Guanajuato Mexico");try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}&limit=10&countrycodes=mx&accept-language=es`);const d=await r.json();const otros=d.map(x=>({lat:parseFloat(x.lat),lon:parseFloat(x.lon),name:x.display_name.split(",")[0],direccion:x.display_name}));resultados=[...resultados,...otros];}catch(e){}return resultados;}
function mostrar(c,res,tipo){c.innerHTML="";if(!res.length){c.innerHTML='<div style="padding:12px;text-align:center">Sin resultados</div>';c.classList.add("show");return;}res.forEach(r=>{const el=document.createElement("div");el.className="suggestion";el.innerHTML=`<div>🛵</div><div><div style="font-weight:800;font-size:13px">${r.name}</div><div style="font-size:10px;color:#777">${r.direccion.substring(0,70)}</div></div>`;el.onclick=()=>{if(tipo==="pickup"){pickupLat=r.lat;pickupLng=r.lon;pickupName=r.name;pickupInput.value=r.name;pickupSuggestions.classList.remove("show");if(pickupMarker)map.removeLayer(pickupMarker);pickupMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("RECOGER: "+r.name).openPopup();map.setView([r.lat,r.lon],16);}else{destinationLat=r.lat;destinationLng=r.lon;destName=r.name;destinationInput.value=r.name;destinationSuggestions.classList.remove("show");if(destinationMarker)map.removeLayer(destinationMarker);destinationMarker=L.marker([r.lat,r.lon]).addTo(map).bindPopup("ENTREGAR: "+r.name).openPopup();map.setView([r.lat,r.lon],16);}};c.appendChild(el);});c.classList.add("show");}
let t1=null;pickupInput.addEventListener("input",function(){const txt=this.value.trim();if(t1)clearTimeout(t1);if(txt.length<2){pickupSuggestions.classList.remove("show");return;}pickupSuggestions.classList.add("show");pickupSuggestions.innerHTML='<div style="padding:10px;text-align:center;font-size:11px">Buscando...</div>';t1=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(pickupSuggestions,res,"pickup");},350);});
let t2=null;destinationInput.addEventListener("input",function(){const txt=this.value.trim();if(t2)clearTimeout(t2);if(txt.length<2){destinationSuggestions.classList.remove("show");return;}destinationSuggestions.classList.add("show");destinationSuggestions.innerHTML='<div style="padding:10px;text-align:center;font-size:11px">Buscando...</div>';t2=setTimeout(async()=>{const res=await buscarColonias(txt);mostrar(destinationSuggestions,res,"destination");},350);});
for(let i=0;i<70;i++){let d=document.createElement("div");d.className="rain";d.style.left=Math.random()*100+"%";d.style.animationDelay=Math.random()*1.2+"s";d.style.animationDuration=(0.5+Math.random()*0.6)+"s";d.style.opacity=0.6+Math.random()*0.4;rainOverlay.appendChild(d);}
async function checarLluvia(){
try{
const r=await fetch("https://api.open-meteo.com/v1/forecast?latitude=21.1561&longitude=-100.9333&current=temperature_2m,precipitation,rain,weather_code&timezone=America/Mexico_City");
const data=await r.json();
const precip=data.current.precipitation;
const temp=Math.round(data.current.temperature_2m);
const code=data.current.weather_code;
let estaLloviendo=precip>0||(code>=51&&code<=99);
if(!estaLloviendo){
extraLluvia=0;
rainOverlay.classList.remove("active");
weatherBadge.classList.remove("show");
weatherWidget.className="weather-widget";
weatherWidget.innerText=`☀️ ${temp}°C`;
return;
}
if(code>=95||precip>7.5||code==65||code==82){
extraLluvia=10;
weatherWidget.className="weather-widget tormenta";
weatherWidget.innerText=`⛈️ ${temp}°C Fuerte`;
weatherBadge.className="weather-badge show tormenta";
weatherBadge.innerText=`⛈️ LLOVIENDO EN DOLORES - Fuerte (${precip}mm) +$10`;
}else if(code==53||code==63||code==81||code==55||(precip>=2.5&&precip<=7.5)){
extraLluvia=5;
weatherWidget.className="weather-widget lluvia";
weatherWidget.innerText=`🌧️ ${temp}°C Moderada`;
weatherBadge.className="weather-badge show moderada";
weatherBadge.innerText=`🌧️ LLOVIENDO EN DOLORES - Moderada (${precip}mm) +$5`;
}else{
extraLluvia=0;
weatherWidget.className="weather-widget lluvia";
weatherWidget.innerText=`🌦️ ${temp}°C Leve`;
weatherBadge.className="weather-badge show leve";
weatherBadge.innerText=`🌦️ LLOVIENDO EN DOLORES - Leve (${precip}mm) +$0`;
}
rainOverlay.classList.add("active");
}catch(e){weatherWidget.innerText=`☀️ --°C`;}
}
checarLluvia(); setInterval(checarLluvia,600000);
document.getElementById("calculateButton").onclick=async()=>{
 if(!pickupLat||!destinationLat){alert("Selecciona donde recoger y donde entregar");return;}
 const url=`https://router.project-osrm.org/route/v1/foot/${pickupLng},${pickupLat};${destinationLng},${destinationLat}?overview=full&geometries=geojson`;
 const r=await fetch(url);const d=await r.json();if(!d.routes||!d.routes[0]){alert("No se pudo trazar ruta");return;}
 const route=d.routes[0];const km=route.distance/1000;
 let precio=35;
 if(route.distance>2000){let extra=route.distance-2000;precio=35+Math.ceil(extra/650)*5;}
 if(distMts(pickupLat,pickupLng,CENTRO.lat,CENTRO.lng)>800&&distMts(destinationLat,destinationLng,CENTRO.lat,CENTRO.lng)>800){precio+=5;}
 let esSOP_Lindavista = (pickupName.toLowerCase().includes("sop") && destName.toLowerCase().includes("linda")) || (destName.toLowerCase().includes("sop") && pickupName.toLowerCase().includes("linda")) || (pickupName.toLowerCase().includes("sop") && destName.toLowerCase().includes("lindavista")) || (destName.toLowerCase().includes("sop") && pickupName.toLowerCase().includes("lindavista"));
 if(esSOP_Lindavista){ precio = 45; }
 if(extraLluvia>0){precio+=extraLluvia;}
 if(routeLayer)map.removeLayer(routeLayer);routeLayer=L.geoJSON(route.geometry,{style:{color:"#E53935",weight:6}}).addTo(map);map.fitBounds(routeLayer.getBounds(),{padding:[40,40]});
 document.getElementById("distance").innerText=km.toFixed(2)+" km";document.getElementById("duration").innerText=Math.ceil(route.duration/60)+" min";document.getElementById("price").innerText="$"+precio+" MXN";
 ultimaDistancia=km.toFixed(2)+" km";ultimoPrecio="$"+precio+" MXN";
 document.getElementById("whatsappButton").classList.add("show");
};
document.getElementById("whatsappButton").onclick=()=>{
 const linkRuta=`https://www.google.com/maps/dir/${pickupLat},${pickupLng}/${destinationLat},${destinationLng}`;
 const mensaje=`*COTIZACIÓN KIGO XPRESS* 🛵\n\n📍 *Recoger:* ${pickupName}\n📦 *Entregar:* ${destName}\n📏 *Distancia:* ${ultimaDistancia}\n💰 *Valor:* ${ultimoPrecio}\n\n🗺️ *Ver ruta:* ${linkRuta}\n\n¿Confirmamos servicio?`;
 const url=`https://wa.me/?text=${encodeURIComponent(mensaje)}`;
 window.open(url,"_blank");
};
document.getElementById("resetBtn").onclick=()=>{
 pickupLat=null;pickupLng=null;destinationLat=null;destinationLng=null;pickupName="";destName="";
 pickupInput.value="";destinationInput.value="";
 document.getElementById("distance").innerText="—";document.getElementById("duration").innerText="—";document.getElementById("price").innerText="$ POR COTIZAR";
 document.getElementById("whatsappButton").classList.remove("show");
 if(pickupMarker)map.removeLayer(pickupMarker);if(destinationMarker)map.removeLayer(destinationMarker);if(routeLayer)map.removeLayer(routeLayer);
 map.setView([CENTRO.lat,CENTRO.lng],14);
};
document.addEventListener("click",e=>{if(!e.target.closest(".input-wrapper")){pickupSuggestions.classList.remove("show");destinationSuggestions.classList.remove("show");}});
const overlay=document.getElementById("adminOverlay");
document.getElementById("btnAdmin").onclick=()=>{ overlay.classList.add("show"); document.getElementById("btnAdmin").classList.add("active"); document.getElementById("btnInicio").classList.remove("active"); };
document.getElementById("btnInicio").onclick=()=>{ overlay.classList.remove("show"); document.getElementById("btnInicio").classList.add("active"); document.getElementById("btnAdmin").classList.remove("active"); setTimeout(()=>{ map.invalidateSize(); },100); };
document.getElementById("closeAdmin").onclick=()=>{ overlay.classList.remove("show"); document.getElementById("btnInicio").classList.add("active"); document.getElementById("btnAdmin").classList.remove("active"); };
overlay.addEventListener("click",(e)=>{ if(e.target===overlay) { overlay.classList.remove("show"); } });
document.getElementById("loginBtn").onclick=()=>{
  const u=document.getElementById("adminUser").value.trim();
  const p=document.getElementById("adminPass").value.trim();
  if(u==='admin' && p==='0831'){
    document.getElementById("loginBox").style.display='none';
    document.getElementById("adminPanel").style.display='block';
    document.getElementById("loginError").style.display='none';
    renderClientes();
  }else{ document.getElementById("loginError").style.display='block'; }
};
document.getElementById("logoutBtn").onclick=()=>{
  document.getElementById("loginBox").style.display='block';
  document.getElementById("adminPanel").style.display='none';
  document.getElementById("adminUser").value=''; document.getElementById("adminPass").value='';
};
let clientes = JSON.parse(localStorage.getItem('kigo_clientes')||'[]');
let editIndex = -1;
function saveLS(){ localStorage.setItem('kigo_clientes', JSON.stringify(clientes)); }
function renderClientes(){
  const lista = document.getElementById("listaClientes");
  const cont = document.getElementById("contadorClientes");
  lista.innerHTML="";
  cont.innerText = clientes.length;
  if(clientes.length===0){ lista.innerHTML='<div style="text-align:center;padding:12px;color:#999;font-size:12px">Sin clientes aún</div>'; return; }
  clientes.forEach((c,i)=>{
    const div = document.createElement("div");
    div.className="cliente-item";
    div.innerHTML=`
      <div style="flex:1;min-width:0">
        <div style="font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.nombre}</div>
        <div style="font-size:11px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.ubicacion}</div>
      </div>
      <div class="cliente-actions">
        <button class="icon-btn" onclick="editarCliente(${i})">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="icon-btn delete" onclick="eliminarCliente(${i})">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </button>
      </div>`;
    lista.appendChild(div);
  });
}
document.getElementById("guardarCliente").onclick=()=>{
  const nom = document.getElementById("clienteNombre").value.trim();
  const ubi = document.getElementById("clienteUbicacion").value.trim();
  if(!nom){ alert("Escribe el nombre"); return; }
  if(!ubi){ alert("Escribe la ubicación"); return; }
  if(editIndex>=0){
    clientes[editIndex] = {nombre:nom, ubicacion:ubi};
    editIndex=-1;
    document.getElementById("guardarCliente").innerText="GUARDAR CLIENTE";
  }else{
    clientes.push({nombre:nom, ubicacion:ubi});
  }
  saveLS(); renderClientes();
  document.getElementById("clienteNombre").value=""; document.getElementById("clienteUbicacion").value="";
};
window.editarCliente=(i)=>{
  editIndex=i;
  document.getElementById("clienteNombre").value=clientes[i].nombre;
  document.getElementById("clienteUbicacion").value=clientes[i].ubicacion;
  document.getElementById("guardarCliente").innerText="ACTUALIZAR CLIENTE";
};
window.eliminarCliente=(i)=>{
  if(confirm(`¿Eliminar a ${clientes[i].nombre}?`)){
    clientes.splice(i,1); saveLS(); renderClientes();
  }
};
document.getElementById("btnVincularUbicacion").onclick=async()=>{
  const txt = document.getElementById("clienteUbicacion").value.trim() || prompt("Escribe colonia para vincular");
  if(!txt) return;
  const res = await buscarColonias(txt);
  if(res.length>0){
    document.getElementById("clienteUbicacion").value = res[0].name + " - " + res[0].direccion.substring(0,50);
  }else{ alert("No se encontró ubicación"); }
};
</script>
</body>
</html>
