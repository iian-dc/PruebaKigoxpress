<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KIGO XPRESS</title>
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"
  }
}
</script>
</head>
<body class="bg-gray-50">
<div class="max-w-md mx-auto p-4">
  <h1 class="text-2xl font-bold text-center">KIGO XPRESS</h1>
  
  <!-- COTIZADOR CLIENTE -->
  <div id="cotizador" class="bg-white p-4 rounded-xl shadow mt-4">
    <input id="nombre" placeholder="Nombre cliente" class="w-full border p-2 rounded mb-2">
    <input id="telefono" placeholder="Teléfono" class="w-full border p-2 rounded mb-2">
    <input id="direccion" placeholder="Dirección" class="w-full border p-2 rounded mb-2">
    <button onclick="guardarClienteNuevo()" class="w-full bg-black text-white p-3 rounded-xl">Guardar Cliente</button>
  </div>

  <!-- LOGIN ADMIN -->
  <div class="mt-6 bg-white p-4 rounded-xl shadow">
    <h2 class="font-bold">Admin</h2>
    <input id="adminUser" placeholder="Usuario" class="w-full border p-2 rounded mb-2 mt-2">
    <input id="adminPass" type="password" placeholder="Contraseña" class="w-full border p-2 rounded mb-2">
    <button onclick="loginAdmin()" class="w-full bg-gray-800 text-white p-2 rounded">Entrar</button>
  </div>

  <!-- PANEL ADMIN OCULTO -->
  <div id="adminPanel" style="display:none;" class="mt-4 bg-white p-4 rounded-xl shadow">
    <h2 class="font-bold">Clientes en la nube (se ven en todos los dispositivos)</h2>
    <div id="listaClientes" class="mt-3"></div>
  </div>
</div>
<!-- AQUI TERMINA LA PARTE 1 -->
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, onValue, push, set, remove, update } from 'firebase/database';

// SOLO MODIFIQUE ESTO QUE ME INDICASTE - CONEXION A TU REALTIME
const firebaseConfig = {
  databaseURL: "https://kigo-xpress-7d2e1-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const clientesRef = ref(db, 'clientes');

// ESTO HACE QUE YA NO SE BORRE AL ACTUALIZAR
onValue(clientesRef, (snapshot) => {
  const data = snapshot.val();
  const lista = data ? Object.entries(data).map(([id, val]) => ({id, ...val})) : [];
  const cont = document.getElementById('listaClientes');
  if(cont){
    cont.innerHTML = lista.map(c => `
      <div class="border p-2 rounded mb-2 flex justify-between">
        <div><b>${c.nombre || ''}</b><br>${c.telefono || ''} - ${c.direccion || ''}</div>
        <button onclick="borrarCliente('${c.id}')" class="text-red-500">X</button>
      </div>
    `).join('') || '<p>No hay clientes</p>';
  }
});

window.guardarClienteNuevo = () => {
  const cliente = {
    nombre: document.getElementById('nombre').value,
    telefono: document.getElementById('telefono').value,
    direccion: document.getElementById('direccion').value,
    fecha: new Date().toISOString()
  };
  if(!cliente.nombre) return alert('Pon nombre');
  const nuevoRef = push(clientesRef);
  set(nuevoRef, cliente).then(() => {
    alert('Guardado en la nube!');
    document.getElementById('nombre').value = '';
    document.getElementById('telefono').value = '';
    document.getElementById('direccion').value = '';
  });
};

window.borrarCliente = (id) => {
  if(confirm('¿Borrar?')) remove(ref(db, 'clientes/' + id));
};

window.loginAdmin = () => {
  const u = document.getElementById('adminUser').value;
  const p = document.getElementById('adminPass').value;
  if(u === 'admin' && p === '0831'){
    document.getElementById('adminPanel').style.display = 'block';
  } else {
    alert('Contraseña incorrecta - solo con contraseña se ven las actualizaciones');
  }
};
</script>
</body>
</html>
